green = "#27ae60" # Green for success (natural green)
teal = "#1abc9c" # Teal for information (teal-green)
blue = "#3498db" # Blue for links and actions (cool blue)
light-blue = "#5dade2" # Sky blue accent (lighter blue)
lavender = "#8e44ad" # Lavender for subtle highlights (muted purple)


[dark.general]
bar-background = "rgb(30, 34, 39)" # Panel background (semi-transparent dark graphite gray)
shadow-color = "rgba(0, 0, 0, 0.5)" # Shadow color (soft dark gray shadows)


