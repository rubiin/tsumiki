# .pre-commit-config.yaml
repos:
  # Default pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the latest stable version
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-merge-conflict # Prevents unresolved merge conflicts
      - id: check-added-large-files # Warns on large files being committed
        args: ["--maxkb=500"] # Adjust the size limit as needed
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: end-of-file-fixer # Ensures files end with a newline
      - id: fix-byte-order-marker
      - id: trailing-whitespace # Removes trailing whitespace
      - id: mixed-line-ending # Converts mixed line endings to LF
        args: ["--fix=lf"] # Set line endings to LF (Unix-style)
      - id: requirements-txt-fixer

  # Ruff for linting, formatting, and import sorting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]

  # isort for import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks

  # oxfmt for docs formatting
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.67.0
    hooks:
      - id: oxfmt
        name: Format docs with oxfmt
        files: '^(?:docs/.*\.(?:astro|ts|tsx|js|jsx|mjs|cjs|json|md|mdx|css)|styles/.*\.scss)$'
        pass_filenames: false

  # oxlint for docs linting
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.60.0
    hooks:
      - id: oxlint
        name: Lint docs with oxlint
        files: '^docs/.*\.(astro|ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
