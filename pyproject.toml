[project]
name = "Tsumiki"
version = "4.9.0"
description = "A semi-customizable bar written using the Fabric Widget System"
readme = "README.md"
requires-python = ">=3.14.7"
authors = [{ name = "Rubin Bhandari", email = "roobin.bhandari@gmail.com" }]

keywords = ["widgets", "gtk", "linux", "pygobject", "bar", "statusbar", "panel", "dock"]

dependencies = [
  "click>=8.5.0",
  "fabric @ git+https://github.com/Fabric-Development/fabric.git@8ae7550978c443d45984ba68f79158536dc26dd7",
  "ijson>=3.5.1",
  "loguru>=0.7.3",
  "pillow>=12.3.0",
  "psutil>=7.2.2",
  "pycairo>=1.29.1",
  "PyGObject==3.50.0",
  "PyGObject-stubs>=2.13.0",
  "pytomlpp>=1.1.0",
  "qrcode>=8.2",
  "requests>=2.34.2",
  "httpx==0.28.1",
  "rlottie-python>=1.3.8",
  "nepali>=1.2.0",
]

classifiers = [
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Panel",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"


[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F", "D101", "N", "SIM", "W", "PERF", "RUF", "I", "E"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[project.urls]
"Website" = "https://github.com/rubiin/tsumiki/wiki"
"Documentation" = "https://github.com/rubiin/tsumiki/wiki"
"Source" = "https://github.com/rubiin/tsumiki"
"Bug Tracker" = "https://github.com/rubiin/tsumiki/issues"
"Changelog" = "https://github.com/rubiin/tsumiki/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["ruff>=0.16.6"]

[tool.uv]
# Tsumiki is an application, not an importable package.
package = false
