tooltip = true
icon_size = 35
ignored = []
anchor = "center"
width = 280
height = 320
layout = "list"
grid_columns = 3
plugins = [
    "calc",
    "clipboard-history",
    "currency",
    "define",
    "emoji",
    "history",
    "kill",
    "search",
    "shorten",
    "translate",
]

[modules.notification]
enabled = true
anchor = "top-right"
auto_dismiss = true
respect_expire = true
dnd_on_screencast = true
ignored = []
transition_type = "slide-left"
transition_duration = 350
per_app_limits = {}
play_sound = false
max_actions = 3
copy_code_action = true   # Offer a COPY action for one-time (2FA) codes
show_timestamp = true     # Relative timestamp (e.g. "5m ago") in the header
dismiss_on_hover = false
sound_file = "notification4"
max_lines = 4
max_expanded_lines = 20

[modules.notification.timeout]
low = 3000
normal = 8000
critical = 15000

[modules.notification.persist]
enabled = true
low = true
normal = true
critical = true
max_count = 200

[modules.screen_corners]
enabled = false
size = 20

[modules.dock]
enabled = true
ignored_apps = []
icon_size = 40
behavior = "intellihide"
tooltip = false
layer = "top"
show_when_no_windows = false
preview_apps = true
preview_size = [200, 130]
group_apps = true
truncation_size = 20
orientation = "horizontal"
always_show_focused = true
hide_special_workspace_apps = false
show_launcher = true
launcher_position = "last"
ignored = []

[modules.desktop_clock]
enabled = false
type = "cookie"
layer = "bottom"
anchor = "bottom-right"
date_format = "%A, %d %B %Y"
time_format = "%H:%M"
cookie_size = 230
cookie_sides = 9
cookie_dial_style = "dots"
cookie_hour_hand_style = "fill"
cookie_minute_hand_style = "medium"
cookie_second_hand_style = "dot"
cookie_date_style = "bubble"
