"$schema" = "https://raw.githubusercontent.com/rubiin/tsumiki/refs/heads/dev/tsumiki.schema.json"

[widgets.launcher_button]
icon = "view-app-grid-symbolic"
icon_size = 20
tooltip = true

[widgets.github_tray]
icon = ""
label = false
label_text = "GitHub"
tooltip = true
# Optional login shown while the gh session user is resolved.
username = ""
# GitHub Enterprise Server host, leave empty for github.com.
# The host must be added to gh first (`gh auth login --hostname ...`).
hostname = ""
avatar_size = 44
default_tab = "inbox"
max_repos = 10
sort_by = "updated"
sort_order = "desc"
# Only show repositories owned by your account (hides org/collaborator repos).
own_repos_only = true
# Seconds profile and repository data stay cached before a refetch (0 disables caching).
cache_ttl = 3600
notification_interval = 60
workflow_runs_max = 10
show_notifications = true
# Editor used to open locally-mapped repositories.
local_editor = "code"
# Map owner/repository to an absolute local path (opened in the editor).
local_projects = { "rubiin/tsumiki" = "~/code/tsumiki" }

[widgets.github_tray.notify_reasons]
review_requests = true
mentions = true
assignments = true
pr_comments = true
issue_comments = true

