# ── Keymap cheatsheet ─────────────────────────────────
# A centered overlay listing `sections`. Sections flow into the currently
# shortest column, so their order decides where each one lands.
[modules.cheatsheet]
enabled = true
layer = "overlay"
anchor = "center"
title = "Hyprland Keymap"
icon = ""
refresh_icon = ""
close_icon = ""
columns = 4
groups_per_page = 8   # Sections per page; extra sections spill onto the next page
column_width = 300   # Fixed column width in px
key_width = 190       # Key badge column width in px, so descriptions line up
accent_keys = ["super"]
transition_type = "crossfade"
transition_duration = 200

