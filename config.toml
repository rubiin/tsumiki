cookie_show_hour_marks = false
cookie_background_opacity = 1.0
cookie_widget_scale = 1.0

[modules.desktop_quotes]
enabled = false
anchor = "bottom-right"
layer = "bottom"
interval = 600

[modules.activate_linux]
enabled = false
anchor = "bottom-right"
layer = "bottom"

[layout]
left_section = ["@group:workspaces-group"]
middle_section = ["date_time", "weather", "mpris"]
right_section = ["@group:sys-group", "@group:utils-group", "system_tray", "power"]

